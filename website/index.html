<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Starring Silver Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Starring Silver Lab: handmade fine-silver jewelry. The idea and the plan, for partners and investors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Gloock&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Landing: hero (tagline left, the silver star mark right) → the six pages as a constellation you follow in order → the ask. */

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px 48px;align-items:center;padding-block:64px 40px}
.hero-copy{min-width:0;display:flex;flex-direction:column;gap:18px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,7.4vw,92px);line-height:.98;letter-spacing:-.01em;margin:0;text-wrap:balance}
.hero h1 .glow{display:block;color:var(--accent);text-shadow:0 0 34px color-mix(in srgb, var(--accent) 38%, transparent)}
.idea{font-size:clamp(17px,1.8vw,20px);line-height:1.5;color:var(--text-2);margin:0;max-width:34ch;text-wrap:pretty}

.mark{position:relative;width:100%;max-width:420px;aspect-ratio:1;justify-self:center;cursor:pointer;border:none;background:none;padding:0;-webkit-tap-highlight-color:transparent}
.mark svg{width:100%;height:100%;display:block;overflow:visible}
.mark .body{transform-box:fill-box;transform-origin:center;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.mark .float{animation:float 7s ease-in-out infinite;transform-box:view-box;transform-origin:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* map */
.map-sec{padding-block:48px 24px}
.map{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));column-gap:10px;row-gap:0;padding-bottom:24px}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.lines .base{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 7;stroke-linecap:round}
.lines .lit{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 5px color-mix(in srgb, var(--accent) 70%, transparent));transition:stroke-dasharray .45s cubic-bezier(.2,.8,.2,1)}
.lines .comet{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--accent));opacity:0}
.group{position:relative;z-index:1;grid-row:2;margin-top:66px;display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-inline:8px}
.group::before,.group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--line))}
.group::after{background:linear-gradient(90deg, var(--line), transparent)}
.stop{position:relative;z-index:1;grid-row:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:12px 8px 16px;border-radius:18px;border:1px solid transparent;
  transform:translateY(var(--dy, 0px));transition:background .25s, border-color .25s}
.slot{position:relative;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);margin-bottom:6px;transition:border-color .25s, box-shadow .25s}
.slot .spark{width:34px;height:34px;color:var(--c);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.num{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.stop b{font-weight:600;font-size:16px;line-height:1.25;text-wrap:balance}
.stop p{margin:0;font-size:13px;line-height:1.4;color:var(--text-2);text-wrap:balance;max-width:20ch}
.stop:hover .slot,.stop:focus-visible .slot,.stop.on .slot{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 12%, transparent), 0 0 28px color-mix(in srgb, var(--c) 35%, transparent)}
.stop:hover .slot .spark,.stop:focus-visible .slot .spark,.stop.on .slot .spark{transform:scale(1.15) rotate(45deg)}
.tag{position:absolute;top:-8px;right:-26px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--accent);border-radius:999px;padding:2px 8px 2px 6px}
.tag .spark{width:10px;height:10px;color:var(--bg)}

main.wrap{padding-bottom:40px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-block:40px 24px}
  .mark{grid-row:1;max-width:240px}
}
@media (max-width:720px){
  .map{grid-template-columns:1fr;row-gap:6px;padding-bottom:12px}
  .group{grid-column:auto!important;grid-row:auto;padding-left:88px;margin-top:14px}
  .group::before{display:none}
  .stop{grid-column:auto!important;grid-row:auto;transform:none;display:grid;grid-template-columns:72px 1fr;grid-template-rows:auto auto auto;column-gap:16px;row-gap:2px;align-items:center;text-align:left;padding:10px 8px}
  .slot{grid-row:1 / 4;margin:0}
  .stop p{max-width:none}
  .tag{right:auto;top:auto;left:50%;bottom:-9px;transform:translateX(-50%);font-size:9.5px;padding:1px 7px 1px 5px}
}
</style>

<canvas id="sparkles" aria-hidden="true"></canvas>
<header class="nav" id="nav" data-clear></header>

<main class="wrap">
  <section class="hero">
    <div class="hero-copy" data-clear>
      <div class="eyebrow" id="place"></div>
      <h1 id="tagline"></h1>
      <p class="idea" id="idea"></p>
    </div>

    <button class="mark" id="mark" type="button" aria-label="Starring Silver Lab star mark. Click to spin." data-clear>
      <svg viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFD37E" stop-opacity=".22"/>
            <stop offset="45%" stop-color="#95C4FF" stop-opacity=".08"/>
            <stop offset="100%" stop-color="#0E0F24" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="340" y2="340">
            <stop offset="0" stop-color="#5E63A8"/>
            <stop offset=".34" stop-color="#C9CCEE"/>
            <stop offset=".5" stop-color="#FFFFFF"/>
            <stop offset=".6" stop-color="#DADCF6"/>
            <stop offset="1" stop-color="#6A6FB6"/>
          </linearGradient>
          <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="340" y2="340">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity=".1"/>
          </linearGradient>
        </defs>
        <circle cx="200" cy="200" r="190" fill="url(#halo)"/>
        <circle cx="200" cy="200" r="150" fill="none" stroke="#3A3F80" stroke-width="1" stroke-dasharray="2 8"/>
        <g class="float">
          <g class="body" id="star-body">
            <!-- 4-point star, a little uneven on purpose, like a hand-formed clay star -->
            <path d="M204 22C210 140 252 182 380 196 252 210 212 250 198 380 190 256 150 216 20 206 150 192 192 150 204 22Z" fill="url(#silver)"/>
            <path d="M204 22C210 140 252 182 380 196 252 210 212 250 198 380 190 256 150 216 20 206 150 192 192 150 204 22Z" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
          </g>
        </g>
        <path class="pulse" d="M330 74c.7 7.5 3.3 10.1 10.8 10.8-7.5.7-10.1 3.3-10.8 10.8-.7-7.5-3.3-10.1-10.8-10.8 7.5-.7 10.1-3.3 10.8-10.8z" fill="#FFE6A3"/>
        <path class="pulse" style="animation-delay:-1.2s" d="M78 300c.5 5.5 2.4 7.4 7.9 7.9-5.5.5-7.4 2.4-7.9 7.9-.5-5.5-2.4-7.4-7.9-7.9 5.5-.5 7.4-2.4 7.9-7.9z" fill="#D2E1FF"/>
      </svg>
    </button>
  </section>

  <section class="map-sec">
    <nav class="map" id="map" aria-label="Site pages in reading order">
      <svg class="lines" id="lines" aria-hidden="true"><path class="base"/><path class="lit"/><path class="comet"/></svg>
    </nav>
  </section>
</main>

<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  const S = window.SITE, L = S.landing, { spark } = window.SSL;
  const $ = id => document.getElementById(id);
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  SSL.renderNav("home");

  /* hero */
  $("place").textContent = S.place;
  const [first, ...rest] = S.tagline.split(" ");
  $("tagline").innerHTML = `<span class="glow">${first}</span>${rest.join(" ")}`;
  $("idea").textContent = S.idea;

  /* constellation of pages */
  const DY = [34, 0, 50, 8, 40, 4];
  const map = $("map");
  map.style.setProperty("--n", S.pages.length);
  let html = "";
  S.groups.forEach(g => {
    const first = S.pages.findIndex(p => p.group === g.id), count = S.pages.filter(p => p.group === g.id).length;
    html += `<div class="group" data-g="${g.id}" style="grid-column:${first + 1} / ${first + 1 + count}">${g.label}</div>`;
    S.pages.forEach((p, i) => {
      if (p.group !== g.id) return;
      html += `<a class="stop" data-clear href="${p.href}" data-page="${p.id}" data-i="${i}" style="--c:${p.color};--dy:${DY[i]}px;grid-column:${i + 1}">
        <span class="slot">${spark()}${i === 0 ? `<span class="tag">${spark()}${L.startTag}</span>` : ""}</span>
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <b>${p.name}</b>
        <p>${p.line}</p>
      </a>`;
    });
  });
  map.insertAdjacentHTML("beforeend", html);

  const svg = $("lines"), base = svg.querySelector(".base"), lit = svg.querySelector(".lit"), comet = svg.querySelector(".comet");
  const stops = [...map.querySelectorAll(".stop")];
  let cum = [0], total = 0;
  function layout(){
    const box = map.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
    const pts = stops.map(s => { const r = s.querySelector(".slot").getBoundingClientRect(); return [r.left - box.left + r.width / 2, r.top - box.top + r.height / 2]; });
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    [base, lit, comet].forEach(el => el.setAttribute("d", d));
    cum = [0]; total = 0;
    for (let i = 1; i < pts.length; i++){ total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(total); }
    light(-1);
  }
  function light(i){
    const len = i < 0 ? 0 : cum[i];
    lit.style.strokeDasharray = `${len} ${total + 10}`;
    stops.forEach((s, k) => s.classList.toggle("on", i >= 0 && k <= i));
  }
  stops.forEach((s, i) => {
    s.addEventListener("pointerenter", () => light(i));
    s.addEventListener("focus", () => light(i));
    s.addEventListener("pointerleave", () => light(-1));
    s.addEventListener("blur", () => light(-1));
  });
  layout();
  new ResizeObserver(layout).observe(map);
  document.fonts && document.fonts.ready.then(layout);

  /* one comet runs the route when the map first comes into view */
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!still && "IntersectionObserver" in window){
    const io = new IntersectionObserver(es => {
      if (!es.some(e => e.isIntersecting)) return;
      io.disconnect();
      comet.style.opacity = 1;
      comet.style.strokeDasharray = `46 ${total + 60}`;
      const a = comet.animate([{strokeDashoffset: 46}, {strokeDashoffset: -total}], {duration: 2200, easing: "cubic-bezier(.45,.05,.3,1)", delay: 250, fill: "both"});
      a.onfinish = () => { comet.style.opacity = 0; };
    }, {threshold: .5});
    io.observe(map);
  }

  /* star mark: the shine follows the pointer; a click spins it */
  const grad = [$("silver"), $("edge")];
  const body = $("star-body"), mark = $("mark");
  let ang = Math.PI / 4, target = ang, turns = 0;
  addEventListener("pointermove", e => {
    const r = mark.getBoundingClientRect();
    target = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) + Math.PI;
  });
  function setGrad(a){
    const c = 200, R = 160, x1 = c - Math.cos(a) * R, y1 = c - Math.sin(a) * R, x2 = c + Math.cos(a) * R, y2 = c + Math.sin(a) * R;
    grad.forEach(g => { g.setAttribute("x1", x1); g.setAttribute("y1", y1); g.setAttribute("x2", x2); g.setAttribute("y2", y2); });
  }
  function tick(){
    let d = target - ang; d = Math.atan2(Math.sin(d), Math.cos(d));
    ang += d * .06; setGrad(ang);
    requestAnimationFrame(tick);
  }
  setGrad(ang);
  if (!still) requestAnimationFrame(tick);
  mark.addEventListener("click", () => { turns += 1; body.style.transform = `rotate(${turns * 90}deg) scale(${turns % 2 ? 1.06 : 1})`; });

  SSL.sparkles();
})();
</script>
