<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Starring Silver Lab · Product</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Gloock&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Product: what one piece is made of (tap a part, it lights up on the drawing) → the pieces on a shelf, now / next / later
   → where the price sits, drawn to scale → what one piece costs, as a bar split into cost and profit. */
.sec{padding-block:72px 8px}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.head p{margin:0;color:var(--text-2);font-size:17px;max-width:46ch;text-wrap:pretty}
.card{position:relative;border:1px solid var(--line);border-radius:26px;overflow:hidden;
  background:radial-gradient(ellipse 70% 60% at 50% 100%, color-mix(in srgb, var(--surface-2) 90%, transparent), transparent 70%), color-mix(in srgb, var(--surface) 55%, transparent)}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}

/* what a piece is made of */
.hero{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:32px 56px;align-items:center;padding-block:56px 24px}
.hero-txt{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,5vw,62px);line-height:1.04;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--t-make);text-shadow:0 0 30px color-mix(in srgb, var(--t-make) 45%, transparent)}
.hero p{margin:0;color:var(--text-2);font-size:18px;max-width:38ch;text-wrap:pretty}
.piece{display:flex;flex-direction:column;align-items:center;padding:22px 20px 18px}
#anatomy{width:100%;max-width:290px;aspect-ratio:1;display:block;overflow:visible}
.part{cursor:pointer;transition:opacity .35s, filter .35s}
.piece.focus .part{opacity:.4}
.piece.focus .part.on{opacity:1;filter:drop-shadow(0 0 7px color-mix(in srgb, var(--accent) 80%, transparent))}
#ghost{opacity:0;transition:opacity .45s}
.piece[data-part="shape"] #ghost{opacity:1}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
.tag{border:1px solid var(--line);background:color-mix(in srgb, var(--bg) 75%, transparent);color:var(--text-2);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .25s}
.tag:hover{color:var(--text);border-color:var(--text-2)}
.tag[aria-pressed="true"]{background:var(--t-make);border-color:var(--t-make);color:var(--bg)}
.detail{margin-top:14px;width:100%;display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line);min-height:86px}
.detail .spark{width:18px;height:18px;color:var(--accent);margin-top:2px}
.detail b{display:block;font-size:15px}
.detail .mat{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:2px 0 4px}
.detail span:last-child{display:block;font-size:14px;color:var(--text-2)}
.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* the pieces */
.shelf{display:flex;gap:14px;align-items:stretch}
.grp{display:flex;flex-direction:column;gap:14px;min-width:0;padding:18px 16px 16px}
.grp-h{display:flex;align-items:baseline;gap:10px;padding-left:4px}
.grp-h .mono{color:var(--accent)}
.grp-h span:last-child{font-size:14px;color:var(--mute)}
.items{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;flex:1}
.item{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:14px 8px 12px;border-radius:16px;border:1px solid transparent;background:color-mix(in srgb, var(--bg) 45%, transparent);cursor:pointer;transition:border-color .25s, background .25s, transform .3s cubic-bezier(.2,.8,.2,1)}
.item:hover{transform:translateY(-3px)}
.item svg{width:100%;max-width:92px;aspect-ratio:1;display:block;overflow:visible}
.item svg .pc{filter:drop-shadow(0 0 3px rgba(255,255,255,.6))}
.item b{font-size:14.5px;font-weight:600;text-align:center;line-height:1.25}
.item[aria-pressed="true"]{border-color:color-mix(in srgb, var(--accent) 65%, transparent);background:color-mix(in srgb, var(--accent) 8%, var(--bg))}
.later .item svg{opacity:.85}
.custom{margin-top:14px;display:inline-flex;align-items:center;gap:10px;border:1px dashed var(--line);background:none;border-radius:999px;padding:9px 16px 9px 12px;font-size:14.5px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all .25s}
.custom .spark{width:15px;height:15px;color:var(--accent)}
.custom small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.custom[aria-pressed="true"]{border-style:solid;border-color:color-mix(in srgb, var(--accent) 65%, transparent);color:var(--text)}
.pick{margin-top:14px;display:grid;grid-template-columns:22px 1fr;gap:10px;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--bg);max-width:640px}
.pick .spark{width:18px;height:18px;color:var(--accent);margin-top:3px}
.pick b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15}
.pick .mat{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:4px 0 6px}
.pick span:last-child{display:block;color:var(--text-2);font-size:15px}

/* price */
.scale{padding:26px 24px 22px;display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 18px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:16px;padding:10px 12px;cursor:pointer;transition:background .25s, border-color .25s}
.prow:hover{background:color-mix(in srgb, var(--bg) 40%, transparent)}
.prow[aria-pressed="true"]{background:color-mix(in srgb, var(--bg) 60%, transparent);border-color:var(--line)}
.plabel b{display:block;font-size:15.5px;font-weight:600}
.plabel small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.track{position:relative;height:30px;border-radius:999px;
  background:linear-gradient(90deg, transparent calc(33.333% - .5px), color-mix(in srgb, var(--line) 70%, transparent) calc(33.333% - .5px) calc(33.333% + .5px), transparent calc(33.333% + .5px) calc(66.666% - .5px), color-mix(in srgb, var(--line) 70%, transparent) calc(66.666% - .5px) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
             color-mix(in srgb, var(--bg) 55%, transparent)}
.band{position:absolute;top:5px;bottom:5px;border-radius:999px;min-width:10px}
.band.ours{background:linear-gradient(90deg, #C9CCEE, #FFFFFF 50%, #DADCF6);box-shadow:0 0 16px color-mix(in srgb, var(--t-make) 45%, transparent)}
.band.est{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--t-make) 75%, transparent) 0 5px, color-mix(in srgb, var(--t-make) 30%, transparent) 5px 9px);box-shadow:none}
.band.them{background:linear-gradient(90deg, var(--mute), color-mix(in srgb, var(--mute) 0%, transparent));border-radius:999px 0 0 999px}
.band.them.closed{background:color-mix(in srgb, var(--mute) 70%, transparent);border-radius:999px}
.prow[aria-pressed="true"] .band.ours{box-shadow:0 0 0 2px var(--accent), 0 0 22px color-mix(in srgb, var(--accent) 45%, transparent)}
.prow[aria-pressed="true"] .band.est{box-shadow:0 0 0 2px var(--accent)}
.prow[aria-pressed="true"] .band.them{box-shadow:0 0 0 2px var(--text-2)}
.axis{position:relative;height:20px;margin:2px 12px 0 calc(170px + 18px + 12px)}
.axis span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.pdetail{margin:10px 12px 0;display:grid;grid-template-columns:22px 1fr;gap:10px;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.pdetail .spark{width:18px;height:18px;color:var(--accent);margin-top:3px}
.pdetail .range{display:block;font-family:var(--f-display);font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.pdetail span:last-child{display:block;color:var(--text-2);font-size:15px;margin-top:4px}

/* what a piece costs */
.cost{padding:24px 24px 22px;display:flex;flex-direction:column;gap:18px}
.cost-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px}
.seg{display:inline-flex;max-width:100%;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.seg button{border:none;background:none;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer;transition:background .25s, color .25s;white-space:nowrap}
.seg button small{font-family:var(--f-mono);font-size:11px;font-weight:400;margin-left:6px;opacity:.75}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.total{text-align:right}
.total .mono{display:block;color:var(--mute)}
.total b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,38px);line-height:1.1;font-variant-numeric:tabular-nums}
.bar{display:flex;height:56px;border-radius:16px;overflow:hidden;gap:3px}
.bar button{border:none;padding:0;min-width:6px;flex-basis:0;background:var(--c);cursor:pointer;transition:flex-grow .6s cubic-bezier(.2,.8,.2,1), opacity .25s, box-shadow .25s}
.bar button.profit{box-shadow:0 0 22px color-mix(in srgb, var(--accent) 45%, transparent)}
.bar.focus button{opacity:.55}
.bar.focus button.on{opacity:1}
.legend{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:8px}
.segs{display:flex;flex-wrap:wrap;gap:10px;min-width:0}
.legend button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid transparent;background:none;border-radius:14px;padding:10px 12px;cursor:pointer;transition:background .25s, border-color .25s;min-width:0}
.legend button:hover{background:color-mix(in srgb, var(--bg) 40%, transparent)}
.legend button[aria-pressed="true"]{background:var(--bg);border-color:var(--line)}
.legend .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.legend .nm i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.legend .amt{font-family:var(--f-mono);font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.legend .pct{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.legend button.profit .amt{color:var(--accent)}
.cnote{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.cnote .spark{width:18px;height:18px;color:var(--accent);margin-top:2px}
.cnote b{display:block;font-size:15px}
.cnote span:last-child{display:block;color:var(--text-2);font-size:14.5px;margin-top:2px}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .legend{grid-template-columns:repeat(3,minmax(0,1fr))}
  .shelf{flex-direction:column}
  .grp{flex:auto!important}
}
@media (max-width:620px){
  .cost{padding:16px 12px 14px}
  .legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .total{text-align:left}
  .segs{width:100%}
  .seg{display:flex;width:100%}
  .legend button:last-child:nth-child(odd){grid-column:1 / -1}
  .seg button{flex:1;padding:7px 8px;font-size:13.5px}
  .seg button small{display:block;margin:1px 0 0}
  .prow{grid-template-columns:1fr}
  .axis{margin-left:12px}
  .scale{padding:16px 10px 14px}
  .item svg{max-width:72px}
}
</style>

<canvas id="sparkles" aria-hidden="true"></canvas>
<header class="nav" id="nav" data-clear></header>

<main class="wrap">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-txt" data-clear>
      <div class="eyebrow" id="hero-eyebrow"></div>
      <h1 id="hero-title"></h1>
      <p id="hero-line"></p>
    </div>
    <div class="card piece" id="piece" data-clear>
      <svg id="anatomy" viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="110" y1="160" x2="290" y2="340">
            <stop offset="0" stop-color="#6A6FB6"/><stop offset=".35" stop-color="#C9CCEE"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset=".62" stop-color="#DADCF6"/><stop offset="1" stop-color="#5E63A8"/>
          </linearGradient>
          <radialGradient id="cz" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#D6E6FF"/><stop offset="1" stop-color="#8FB4F2"/></radialGradient>
        </defs>
        <g class="part" data-part="cord">
          <path d="M14 62Q200 192 386 62" fill="none" stroke="#C9CCEE" stroke-width="5" stroke-dasharray="8 3" stroke-linecap="round"/>
          <path d="M14 62Q200 192 386 62" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="4 7" stroke-dashoffset="-2" opacity=".75"/>
        </g>
        <g class="part" data-part="pendant">
          <path transform="translate(100 143) scale(.5)" d="M204 22C210 140 252 182 380 196 252 210 212 250 198 380 190 256 150 216 20 206 150 192 192 150 204 22Z" fill="url(#silver)"/>
          <path transform="translate(100 143) scale(.5)" d="M204 22C210 140 252 182 380 196 252 210 212 250 198 380 190 256 150 216 20 206 150 192 192 150 204 22Z" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2.4"/>
          <ellipse cx="216" cy="220" rx="4" ry="2.6" fill="#3B3F80" opacity=".28"/>
          <ellipse cx="184" cy="266" rx="3" ry="2" fill="#3B3F80" opacity=".24"/>
          <ellipse cx="230" cy="250" rx="2.4" ry="1.6" fill="#FFFFFF" opacity=".5"/>
          <ellipse cx="172" cy="238" rx="2.2" ry="1.5" fill="#FFFFFF" opacity=".45"/>
        </g>
        <path id="ghost" transform="translate(100 143) scale(.5)" d="M200 22C206 150 250 194 380 200 250 206 206 250 200 378 194 250 150 206 20 200 150 194 194 150 200 22Z" fill="none" stroke="#FFD37E" stroke-width="3" stroke-dasharray="7 9"/>
        <g class="part" data-part="stone">
          <circle cx="201" cy="243" r="12" fill="url(#cz)" stroke="#E4E5FF" stroke-width="2"/>
          <path d="M195 238l6-4 6 4M201 234v6" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".8"/>
        </g>
        <g class="part" data-part="ring">
          <circle cx="201" cy="142" r="13" fill="none" stroke="#E4E5FF" stroke-width="4.5"/>
        </g>
        <path class="pulse" d="M300 160c.6 7 3.1 9.5 10.2 10.2-7 .6-9.5 3.1-10.2 10.2-.6-7-3.1-9.5-10.2-10.2 7-.6 9.5-3.1 10.2-10.2z" fill="#FFE6A3"/>
        <path class="pulse" style="animation-delay:-1.2s" d="M104 300c.5 5 2.2 6.8 7.2 7.2-5 .5-6.8 2.2-7.2 7.2-.5-5-2.2-6.8-7.2-7.2 5-.5 6.8-2.2 7.2-7.2z" fill="#D2E1FF"/>
      </svg>
      <div class="tags" id="tags" role="group" aria-label="What this piece is made of"></div>
      <div class="detail" id="detail" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="shelf-title">
    <div class="head" data-clear><h2 id="shelf-title"></h2></div>
    <div class="shelf" id="shelf" data-clear></div>
    <div data-clear>
      <button class="custom" id="custom" type="button" aria-pressed="false"></button>
      <div class="pick" id="pick" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="price-title">
    <div class="head" data-clear><h2 id="price-title"></h2><p id="price-line"></p></div>
    <div class="card scale" id="scale" data-clear>
      <div id="prows"></div>
      <div class="axis" id="axis" aria-hidden="true"></div>
      <div class="pdetail" id="pdetail" aria-live="polite"></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="cost-title">
    <div class="head" data-clear><h2 id="cost-title"></h2><p id="cost-line"></p></div>
    <div class="card cost" id="cost" data-clear>
      <div class="cost-top">
        <div class="segs"><div class="seg" id="cost-seg" role="group" aria-label="Size"></div><div class="seg" id="cost-form" role="group" aria-label="Sold as"></div></div>
        <div class="total"><span class="mono" id="cost-plabel"></span><b id="cost-price"></b></div>
      </div>
      <div class="bar" id="cost-bar"></div>
      <div class="legend" id="cost-legend"></div>
      <div class="cnote" id="cost-note" aria-live="polite"></div>
    </div>
  </section>

  <nav class="pager" id="pager" aria-label="Pages" data-clear style="margin-top:56px"></nav>
</main>

<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  const S = window.SITE, P = S.product, { spark } = window.SSL;
  const $ = id => document.getElementById(id);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pop = el => { el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); };
  const vnd = n => n.toLocaleString("en-US") + "₫";

  SSL.renderNav("product");
  SSL.renderPager("product");

  /* ---------- what a piece is made of ---------- */
  const H = P.hero;
  $("hero-eyebrow").textContent = H.eyebrow;
  $("hero-title").innerHTML = H.title.replace(H.glow, `<em>${H.glow}</em>`);
  $("hero-line").textContent = H.line;
  const piece = $("piece"), tags = $("tags"), detail = $("detail");
  const PART_OF = {shape: "pendant"};
  tags.innerHTML = H.parts.map((p, i) => `<button class="tag" type="button" data-i="${i}" aria-pressed="false">${p.label}</button>`).join("");
  function pickPart(i, animate){
    const p = H.parts[i], part = PART_OF[p.id] || p.id;
    tags.querySelectorAll(".tag").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    piece.classList.add("focus"); piece.dataset.part = p.id;
    piece.querySelectorAll(".part").forEach(g => g.classList.toggle("on", g.dataset.part === part));
    detail.innerHTML = `${spark()}<div><b>${p.label}</b><span class="mat">${p.mat}</span><span>${p.detail}</span></div>`;
    if (animate) pop(detail);
  }
  tags.addEventListener("click", e => { const b = e.target.closest(".tag"); if (b) pickPart(+b.dataset.i, true); });
  piece.querySelectorAll(".part").forEach(g => g.addEventListener("click", () => {
    const i = H.parts.findIndex(p => p.id === g.dataset.part); if (i >= 0) pickPart(i, true);
  }));
  pickPart(0, false);

  /* ---------- the pieces ---------- */
  const SILVER = "#F4F2FF", STAR = SSL.STAR;
  const star = (x, y, r) => `<g class="pc"><path fill="${SILVER}" transform="translate(${x - r} ${y - r}) scale(${r / 12})" d="${STAR}"/></g>`;
  const ICON = {
    pendant: () => `<path d="M24 14Q50 70 76 14" fill="none" stroke="#C9CCEE" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><circle cx="50" cy="57" r="3.4" fill="none" stroke="${SILVER}" stroke-width="1.6"/>${star(50, 72, 13)}`,
    choker:  () => `<path d="M14 26Q50 62 86 26" fill="none" stroke="#2A2158" stroke-width="7" stroke-linecap="round"/><path d="M14 24Q50 59 86 24" fill="none" stroke="#5A4A9E" stroke-width="1.3" opacity=".8"/><circle cx="50" cy="47" r="3" fill="none" stroke="${SILVER}" stroke-width="1.5"/>${star(50, 60, 10)}`,
    earrings:() => [30, 70].map(x => `<path d="M${x} 16c7 0 8 10 0 13" fill="none" stroke="#C9CCEE" stroke-width="1.6"/><path d="M${x} 29v10" stroke="${SILVER}" stroke-width="1.4"/>${star(x, 53, 9)}<circle cx="${x}" cy="72" r="3.2" fill="${SILVER}" class="pc"/><path d="M${x} 62v7" stroke="${SILVER}" stroke-width="1.2"/>`).join(""),
    cast:    () => `${star(50, 48, 26)}<rect x="56" y="70" width="28" height="15" rx="4" fill="#262A63" stroke="#C9CCEE" stroke-width="1.2"/><text x="70" y="81" text-anchor="middle" font-family="DM Mono, monospace" font-size="9.5" fill="${SILVER}">925</text>`,
    bracelet:() => `<ellipse cx="50" cy="42" rx="32" ry="18" fill="none" stroke="#C9CCEE" stroke-width="1.8" stroke-dasharray="3 2.5"/><path d="M30 56v6M50 60v7M70 56v6" stroke="${SILVER}" stroke-width="1.3"/><circle cx="30" cy="66" r="4.5" fill="#8FB4F2" stroke="${SILVER}" stroke-width="1.2"/>${star(50, 74, 7)}<path d="M65 66a5 5 0 0 0 10 0Z" fill="${SILVER}" class="pc"/>`,
    ring:    () => `<ellipse cx="50" cy="58" rx="24" ry="22" fill="none" stroke="#C9CCEE" stroke-width="5"/><ellipse cx="50" cy="58" rx="24" ry="22" fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".6"/><path d="M41 34l9-10 9 10-9 6Z" fill="#D6E6FF" stroke="${SILVER}" stroke-width="1.2" class="pc"/>`
  };
  const SH = P.shelf, shelf = $("shelf"), pick = $("pick"), custom = $("custom");
  $("shelf-title").textContent = SH.title;
  shelf.innerHTML = SH.groups.map(g => {
    const its = SH.items.filter(it => it.group === g.id);
    return `<div class="card grp ${g.id}" style="flex:${its.length} 1 0">
      <div class="grp-h"><span class="mono">${g.label}</span><span>${g.line}</span></div>
      <div class="items" style="--n:${its.length}">${its.map(it => `<button class="item" type="button" data-id="${it.id}" aria-pressed="false"><svg viewBox="0 0 100 100" aria-hidden="true">${ICON[it.icon]()}</svg><b>${it.name}</b></button>`).join("")}</div>
    </div>`;
  }).join("");
  custom.innerHTML = `${spark()}${SH.custom.name}<small>${SH.custom.tag}</small>`;
  function pickItem(id, animate){
    const it = id === "custom" ? SH.custom : SH.items.find(x => x.id === id);
    shelf.querySelectorAll(".item").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
    custom.setAttribute("aria-pressed", String(id === "custom"));
    pick.innerHTML = `${spark()}<div><b>${it.name}</b><span class="mat">${it.mat}</span><span>${it.line}</span></div>`;
    if (animate) pop(pick);
  }
  shelf.addEventListener("click", e => { const b = e.target.closest(".item"); if (b) pickItem(b.dataset.id, true); });
  custom.addEventListener("click", () => pickItem("custom", true));
  pickItem(SH.items[0].id, false);

  /* ---------- price, drawn to scale ---------- */
  const PR = P.price, MAX = PR.max;
  $("price-title").textContent = PR.title;
  $("price-line").textContent = PR.line;
  const pct = v => (v / MAX * 100).toFixed(2) + "%";
  $("prows").innerHTML = PR.rows.map(r => {
    const to = r.to || MAX, cls = r.ours ? (r.est ? "ours est" : "ours") : (r.to ? "them closed" : "them");
    return `<button class="prow" type="button" data-id="${r.id}" aria-pressed="false">
      <span class="plabel"><b>${r.name}</b><small>${r.sub}</small></span>
      <span class="track"><span class="band ${cls}" style="left:${pct(r.from)};width:${pct(to - r.from)}"></span></span>
    </button>`;
  }).join("");
  $("axis").innerHTML = PR.ticks.map(t => `<span style="left:${pct(t.v)}">${t.label}</span>`).join("");
  const pdetail = $("pdetail");
  function pickRow(id, animate){
    const r = PR.rows.find(x => x.id === id);
    document.querySelectorAll(".prow").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
    const range = r.to ? `${vnd(r.from)} – ${vnd(r.to)}` : `${vnd(r.from)} ${PR.andUp}`;
    pdetail.innerHTML = `${spark()}<div><span class="range">${r.est ? PR.about + " " : ""}${range}</span><span>${r.note}</span></div>`;
    if (animate) pop(pdetail);
  }
  $("prows").addEventListener("click", e => { const b = e.target.closest(".prow"); if (b) pickRow(b.dataset.id, true); });
  pickRow(PR.start, false);


  /* ---------- what a piece costs ---------- */
  const C = P.cost, K = C.kinds;
  $("cost-title").textContent = C.title;
  $("cost-line").textContent = C.line;
  $("cost-plabel").textContent = C.priceLabel;
  const seg = $("cost-seg"), form = $("cost-form"), bar = $("cost-bar"), legend = $("cost-legend"), cnote = $("cost-note");
  const segBtns = (list) => list.map(o => `<button type="button" data-id="${o.id}" aria-pressed="false">${o.name}${o.sub ? `<small>${o.sub}</small>` : ""}</button>`).join("");
  seg.innerHTML = segBtns(C.sizes);
  form.innerHTML = segBtns(C.forms);
  const ALL = Object.keys(K);
  bar.innerHTML = ALL.map(k => `<button type="button" class="${k}" data-id="${k}" style="--c:${K[k].color}" aria-label="${K[k].name}"></button>`).join("");
  let size = C.sizes[0].id, kind = C.forms[0].id, partId = C.start;
  const current = () => C.pieces.find(x => x.id === `${size}-${kind}`);
  function drawCost(animate){
    const pc = current();
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === size)));
    form.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === kind)));
    $("cost-price").textContent = vnd(pc.price);
    ALL.forEach(k => { const x = pc.parts.find(y => y.id === k), el = bar.querySelector(`[data-id="${k}"]`); el.style.flexGrow = x ? x.amount : 0; el.hidden = !x; });
    legend.style.setProperty("--n", pc.parts.length);
    legend.innerHTML = pc.parts.map(x => `<button type="button" class="${x.id}" data-id="${x.id}" aria-pressed="false" style="--c:${K[x.id].color}"><span class="nm"><i></i>${K[x.id].name}</span><span class="amt">${vnd(x.amount)}</span><span class="pct">${Math.round(x.amount / pc.price * 100)}%</span></button>`).join("");
    if (!pc.parts.some(x => x.id === partId)) partId = C.start;
    pickCost(partId, animate);
  }
  function pickCost(id, animate){
    const pc = current(), x = pc.parts.find(y => y.id === id);
    if (!x) return;
    partId = id;
    bar.classList.add("focus");
    bar.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
    legend.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
    cnote.innerHTML = `${spark()}<div><b>${K[id].name} · ${vnd(x.amount)}</b><span>${x.note}</span></div>`;
    if (animate) pop(cnote);
  }
  form.addEventListener("click", e => { const b = e.target.closest("button"); if (b){ kind = b.dataset.id; drawCost(true); } });
  seg.addEventListener("click", e => { const b = e.target.closest("button"); if (b){ size = b.dataset.id; drawCost(true); } });
  bar.addEventListener("click", e => { const b = e.target.closest("button"); if (b) pickCost(b.dataset.id, true); });
  legend.addEventListener("click", e => { const b = e.target.closest("button"); if (b) pickCost(b.dataset.id, true); });
  drawCost(false);

  SSL.sparkles();
})();
</script>
